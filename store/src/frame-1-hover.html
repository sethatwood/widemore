<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"></head>
<body>
  <div class="frame">
    <div class="cap">
      <h1>rest your cursor <em>on the edge.</em></h1>
      <p>A faint rail waits at each side of every page. A fill runs while you
        decide — drift away and nothing happens.</p>
    </div>
    <div class="stage">
      <div class="browser">
        <div class="browser-chrome">
          <span class="dots"><span></span><span></span><span></span></span>
          <span class="urlbar">en.wikipedia.org/wiki/Ultrawide_monitor</span>
        </div>
        <div class="demo-page">
          <div class="demo-col">
            <div class="tl h"></div>
            <div class="tl w95"></div><div class="tl"></div><div class="tl w88"></div>
            <div class="tl w75"></div>
            <div class="tl gap w95"></div><div class="tl"></div><div class="tl w88"></div>
            <div class="tl w95"></div><div class="tl w60"></div>
            <div class="tl gap w88"></div><div class="tl w95"></div><div class="tl w75"></div>
            <div class="tl gap w95"></div><div class="tl w88"></div><div class="tl"></div>
            <div class="tl w95"></div><div class="tl w60"></div>
          </div>
          <div class="demo-rail left"><div class="bar"><div class="fill"></div></div></div>
          <div class="demo-rail right hovering lit" style="--fill:.55">
            <div class="bar"><div class="fill"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <span class="wordmark">widemore</span>
</body>
</html>
