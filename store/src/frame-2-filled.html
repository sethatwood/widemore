<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"></head>
<body>
  <div class="frame">
    <div class="cap">
      <h1>the page fills <em>your glass.</em></h1>
      <p>widemore finds the content column and zooms until it spans your
        window — probing the layout as it goes, so nothing breaks.</p>
    </div>
    <div class="stage">
      <div class="browser">
        <div class="browser-chrome">
          <span class="dots"><span></span><span></span><span></span></span>
          <span class="urlbar">en.wikipedia.org/wiki/Ultrawide_monitor</span>
        </div>
        <div class="demo-page zoomed">
          <div class="demo-col">
            <div class="tl h"></div>
            <div class="tl w95"></div><div class="tl"></div><div class="tl w88"></div>
            <div class="tl w75"></div>
            <div class="tl gap w95"></div><div class="tl"></div><div class="tl w88"></div>
            <div class="tl w60"></div>
          </div>
          <div class="demo-rail left"><div class="bar"><div class="fill"></div></div></div>
          <div class="demo-rail right"><div class="bar"><div class="fill"></div></div></div>
          <div class="demo-toast">widemore: article → 172%</div>
        </div>
      </div>
    </div>
  </div>
  <span class="wordmark">widemore</span>
</body>
</html>
