<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  body { width: 440px; height: 280px; }
  .tile {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .tile h1 { font: 600 40px var(--mono); letter-spacing: -0.02em; }
  .tile p { font: 400 13px var(--mono); color: var(--dim); }
  .edge-rail.l { width: 14px; height: 120px; border-radius: 0 7px 7px 0; }
  .edge-rail.r { width: 14px; height: 170px; border-radius: 7px 0 0 7px; }
</style>
</head>
<body>
  <div class="edge-rail l"></div>
  <div class="edge-rail r"></div>
  <div class="tile">
    <h1>widemore</h1>
    <p>hover the edge, fill the screen</p>
  </div>
</body>
</html>
