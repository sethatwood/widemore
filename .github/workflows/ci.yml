name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax
        run: |
          node --check background.js
          node --check content.js
          node --check defaults.js
          node --check popup.js
          node --check welcome.js
          node --check site/public/demo.js
      - name: manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: zoom loop replay
        run: node test/zoomfit.test.js
      - name: content column replay
        run: node test/detect.test.js
